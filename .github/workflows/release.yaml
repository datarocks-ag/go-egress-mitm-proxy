name: Release go-egress-proxy

# No pull_request trigger: ci.yaml owns PR checking. Adding one here would run
# lint/test/security/build twice on every PR to main.
on:
  push:
    branches: [main]
    tags: ['v*']

# Keyed on the commit, not the ref. A merge to main and a v* tag on the same
# commit arrive as refs/heads/main and refs/tags/v..., which are different
# groups — so keying on github.ref left exactly the duplicate this is meant to
# prevent: two image builds and two pushes for one commit. cancel-in-progress
# stays false because a run already pushing should finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Same invocation as CI. golangci-lint is a go.mod tool dependency
      # (`tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint`), so
      # `go tool` resolves and builds it from the pinned module version — no
      # separate install step, and nothing to drift. The action with
      # "version: latest" meant an upstream release could redden main for
      # findings no PR could have caught, with no way to reproduce locally.
      - name: golangci-lint
        run: go tool golangci-lint run

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: github.event_name != 'pull_request'
        with:
          files: coverage.out
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Publish Trivy results to summary
        if: always()
        run: |
          if [[ -s trivy-results.txt ]]; then
            {
              echo "### Security Scan Results"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```'
              cat trivy-results.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "No CRITICAL or HIGH vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${VERSION}" -o mitm-proxy ./cmd/mitm-proxy

      - name: Upload artbuifact
        uses: actions/upload-artifact@v7
        with:
          name: mitm-proxy
          path: mitm-proxy

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          echo "VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> $GITHUB_OUTPUT
          # RFC 3339, as org.opencontainers.image.created requires.
          echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # metadata-action derives org.opencontainers.image.description from the
          # GitHub repository description. That field is empty, so it emitted an
          # empty label which overrode the Dockerfile's -- the published package
          # then showed "No description provided". Setting it explicitly keeps the
          # value in the repository, reviewable in a diff, rather than in a
          # settings field nothing points at.
          labels: |
            org.opencontainers.image.description=MITM HTTP/HTTPS egress proxy with split-brain DNS: ACL policy (whitelist/blacklist/passthrough), domain rewrites to internal targets, header injection and selective request tracing.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Data Rocks AG

      # Build once, locally, with the final tags. The image that gets scanned
      # below is then byte-for-byte the image that gets pushed. Previously a
      # throwaway ":scan" image was built and scanned while a second
      # build-push-action rebuilt and pushed independently, so the published
      # artifact was never the one the scanner looked at.
      # Built once, tagged with both the final tags and a fixed local scan tag.
      # The scan tag is a stable reference into this same image, so the scanner
      # does not depend on the order or contents of the generated tag list;
      # indexing tags[0] would break the moment the tag rules changed. It is
      # local-only and never pushed.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.IMAGE_NAME }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.version.outputs.CREATED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (Docker image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'table'
          output: 'trivy-docker-results.txt'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Publish Trivy results to summary
        if: always()
        run: |
          if [[ -s trivy-docker-results.txt ]]; then
            {
              echo "### Docker Image Security Scan Results"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```'
              cat trivy-docker-results.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "### Docker Image Security Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "No CRITICAL or HIGH vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Log in to Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish to ghcr.io only for v* tags. Merges to main still build and
      # Trivy-scan the image, they just do not push it. Pushing the locally
      # built tags guarantees the published digest is the scanned digest.
      - name: Push image
        if: startsWith(github.ref, 'refs/tags/v')
        # Tags arrive via env rather than being interpolated into the script:
        # ${{ }} substitution happens before the shell sees the line, so a value
        # containing shell metacharacters would be executed. A here-string also
        # avoids the subshell and the transformations echo can apply.
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            printf 'Pushing %s\n' "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [lint, test, security, build, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build release binaries
        run: |
          mkdir -p dist
          VERSION=${{ steps.version.outputs.VERSION }}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/mitm-proxy-linux-amd64 ./cmd/mitm-proxy

          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/mitm-proxy-linux-arm64 ./cmd/mitm-proxy

          # macOS AMD64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/mitm-proxy-darwin-amd64 ./cmd/mitm-proxy

          # macOS ARM64 (Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/mitm-proxy-darwin-arm64 ./cmd/mitm-proxy

          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/mitm-proxy-windows-amd64.exe ./cmd/mitm-proxy

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/mitm-proxy-linux-amd64
            dist/mitm-proxy-linux-arm64
            dist/mitm-proxy-darwin-amd64
            dist/mitm-proxy-darwin-arm64
            dist/mitm-proxy-windows-amd64.exe
            dist/checksums.txt
