name: CI go-egress-proxy

# Pull requests only.
#
# This previously also triggered on pushes to feature/bugfix/hotfix/release/
# dependabot branches. Running both meant every push to a branch with an open PR
# started two runs; a concurrency group collapsed them, but "collapsed" means one
# run is cancelled, and a cancelled run reports as a failed check on the PR. Red
# X's for work that actually passed are worse than the duplication they prevent.
#
# Triggering on pull_request alone gives every PR a full set of checks regardless
# of how its branch is named — the gap that motivated adding the trigger — with
# no second event to race. Pushes to main are covered by release.yaml.
#
# No `branches:` filter, so this covers stacked PRs. With `branches: [main]` a PR
# based on another feature branch matched nothing and ran no checks at all: an
# eight-PR stack merged with only the bottom one ever tested, and a PR with no
# checks looks the same in the UI as a PR that passed. Listing the branch
# prefixes instead would leave the same trap for any base that does not match the
# convention, and the failure mode is silence, so there is nothing to alert on.
on:
  pull_request:

# Supersede in-flight runs when a PR is pushed to again. Only one event type
# reaches this workflow now, so this cannot cancel a run for a different event.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        run: go tool golangci-lint run

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        # This workflow triggers on pull_request only, so the previous
        # "if: github.event_name != 'pull_request'" was always false: coverage
        # was computed with -coverprofile and then discarded. PR coverage is the
        # coverage worth seeing.
        with:
          files: coverage.out
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          # Without exit-code the action always exits 0, so this job was green
          # whatever it found -- a hard dependency of build and test-e2e that
          # read as a gate and was decorative. Record accepted risk in
          # .trivyignore rather than by ignoring the result.
          exit-code: '1'

      - name: Publish Trivy results to summary
        # always(): the scan step now fails the job on a finding, and the
        # findings are the thing you need to see when it does.
        if: always()
        run: |
          if [[ -s trivy-results.txt ]]; then
            {
              echo "### Security Scan Results"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```'
              cat trivy-results.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "No CRITICAL or HIGH vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          fi

  test-e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run e2e tests
        run: go test -v -tags e2e -count=1 -timeout 300s ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" -o mitm-proxy ./cmd/mitm-proxy

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mitm-proxy
          path: mitm-proxy
